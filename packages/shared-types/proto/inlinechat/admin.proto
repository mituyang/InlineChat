syntax = "proto3";

package inlinechat.admin.v1;

option go_package = "inlinechat/packages/shared-types/proto/adminv1";

service AdminGatewayService {
  rpc CreateSite(CreateSiteRequest) returns (Site);
  rpc ListSites(ListSitesRequest) returns (ListSitesResponse);
  rpc GetSiteBySiteID(GetSiteBySiteIDRequest) returns (Site);
  rpc CreateAgent(CreateAgentRequest) returns (Agent);
  rpc ListAgents(ListAgentsRequest) returns (ListAgentsResponse);
}

message CreateSiteRequest {
  string authorization = 1;
  string name = 2;
  string domain = 3;
  string site_id = 4;
}

message ListSitesRequest {
  string authorization = 1;
  int32 limit = 2;
  int32 offset = 3;
}

message GetSiteBySiteIDRequest {
  string site_id = 1;
}

message CreateAgentRequest {
  string authorization = 1;
  string email = 2;
  string password = 3;
  string display_name = 4;
  string role = 5;
}

message ListAgentsRequest {
  string authorization = 1;
  int32 limit = 2;
  int32 offset = 3;
}

message Site {
  uint64 id = 1;
  string site_id = 2;
  string name = 3;
  string domain = 4;
  string widget_key = 5;
  string status = 6;
  string created_at = 7;
  string updated_at = 8;
}

message Agent {
  uint64 id = 1;
  string email = 2;
  string display_name = 3;
  string role = 4;
  string status = 5;
  string created_at = 6;
  string updated_at = 7;
}

message ListSitesResponse {
  repeated Site items = 1;
}

message ListAgentsResponse {
  repeated Agent items = 1;
}
