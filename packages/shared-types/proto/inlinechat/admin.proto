syntax = "proto3";

package inlinechat.admin.v1;

option go_package = "inlinechat/packages/shared-types/proto/adminv1";

service AdminGatewayService {
  rpc CreateSite(CreateSiteRequest) returns (Site);
  rpc ListSites(ListSitesRequest) returns (ListSitesResponse);
  rpc GetSiteBySiteID(GetSiteBySiteIDRequest) returns (Site);
  rpc GetSiteByDomain(GetSiteByDomainRequest) returns (Site);
  rpc UpdateSiteStatus(UpdateSiteStatusRequest) returns (Site);
  rpc RotateSiteWidgetKey(RotateSiteWidgetKeyRequest) returns (Site);
  rpc GetSiteAIConfig(GetSiteAIConfigRequest) returns (SiteAIConfig);
  rpc UpdateSiteAIConfig(UpdateSiteAIConfigRequest) returns (SiteAIConfig);
  rpc CreateAgent(CreateAgentRequest) returns (Agent);
  rpc GetAgentByID(GetAgentByIDRequest) returns (Agent);
  rpc ListAgents(ListAgentsRequest) returns (ListAgentsResponse);
  rpc UpdateAgentStatus(UpdateAgentStatusRequest) returns (Agent);
  rpc ResetAgentPassword(ResetAgentPasswordRequest) returns (Agent);
  rpc ForceAgentLogout(ForceAgentLogoutRequest) returns (Agent);
  rpc ListAuditLogs(ListAuditLogsRequest) returns (ListAuditLogsResponse);
}

message CreateSiteRequest {
  string authorization = 1;
  string name = 2;
  string domain = 3;
  string site_id = 4;
}

message ListSitesRequest {
  string authorization = 1;
  int32 limit = 2;
  int32 offset = 3;
}

message GetSiteBySiteIDRequest {
  string site_id = 1;
}

message GetSiteByDomainRequest {
  string domain = 1;
}

message UpdateSiteStatusRequest {
  string authorization = 1;
  string site_id = 2;
  string status = 3;
}

message RotateSiteWidgetKeyRequest {
  string authorization = 1;
  string site_id = 2;
}

message GetSiteAIConfigRequest {
  string site_id = 1;
}

message UpdateSiteAIConfigRequest {
  string authorization = 1;
  string site_id = 2;
  bool enabled = 3;
  string reply_mode = 4;
}

message CreateAgentRequest {
  string authorization = 1;
  string email = 2;
  string password = 3;
  string display_name = 4;
  string role = 5;
  string agent_id = 6;
  string site_id = 7;
}

message GetAgentByIDRequest {
  uint64 agent_id = 1;
}

message ListAgentsRequest {
  string authorization = 1;
  int32 limit = 2;
  int32 offset = 3;
}

message UpdateAgentStatusRequest {
  string authorization = 1;
  uint64 agent_id = 2;
  string status = 3;
}

message ResetAgentPasswordRequest {
  string authorization = 1;
  uint64 agent_id = 2;
  string new_password = 3;
}

message ForceAgentLogoutRequest {
  string authorization = 1;
  uint64 agent_id = 2;
}

message ListAuditLogsRequest {
  string authorization = 1;
  int32 limit = 2;
  int32 offset = 3;
  uint64 actor_agent_id = 4;
  string action = 5;
  string resource_type = 6;
}

message Site {
  uint64 id = 1;
  string site_id = 2;
  string name = 3;
  string domain = 4;
  string widget_key = 5;
  string status = 6;
  string created_at = 7;
  string updated_at = 8;
}

message SiteAIConfig {
  string site_id = 1;
  bool enabled = 2;
  string reply_mode = 3;
  string updated_at = 4;
}

message Agent {
  uint64 id = 1;
  string email = 2;
  string display_name = 3;
  string role = 4;
  string status = 5;
  string created_at = 6;
  string updated_at = 7;
  string site_id = 8;
}

message ListSitesResponse {
  repeated Site items = 1;
}

message ListAgentsResponse {
  repeated Agent items = 1;
}

message AuditLog {
  uint64 id = 1;
  uint64 actor_agent_id = 2;
  string actor_email = 3;
  string actor_role = 4;
  string action = 5;
  string resource_type = 6;
  string resource_id = 7;
  string summary = 8;
  string ip = 9;
  string user_agent = 10;
  string created_at = 11;
}

message ListAuditLogsResponse {
  repeated AuditLog items = 1;
}
