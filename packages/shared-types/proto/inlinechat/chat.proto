syntax = "proto3";

package inlinechat.chat.v1;

option go_package = "inlinechat/packages/shared-types/proto/chatv1";

service ChatInternalService {
  rpc CreateMessage(CreateMessageRequest) returns (CreateMessageResponse);
  rpc MarkMessageDelivered(MarkMessageDeliveredRequest) returns (MarkMessageDeliveredResponse);
}

service ChatGatewayService {
  rpc CreateConversation(CreateConversationRequest) returns (Conversation);
  rpc ListConversations(ListConversationsRequest) returns (ListConversationsResponse);
  rpc GetConversation(GetConversationRequest) returns (Conversation);
  rpc CreateMessage(CreateMessageRequest) returns (Message);
  rpc ListMessages(ListMessagesRequest) returns (ListMessagesResponse);
  rpc MarkMessagesRead(MarkMessagesReadRequest) returns (MarkMessagesReadResponse);
  rpc ClaimConversation(ClaimConversationRequest) returns (Conversation);
  rpc TransferConversation(TransferConversationRequest) returns (Conversation);
  rpc ConfirmTransferConversation(ConfirmTransferConversationRequest) returns (Conversation);
  rpc CloseConversation(CloseConversationRequest) returns (Conversation);
}

message Conversation {
  uint64 id = 1;
  string site_id = 2;
  string visitor_token = 3;
  string status = 4;
  string created_at = 5;
  string updated_at = 6;
  uint64 assigned_agent_id = 7;
  string closed_at = 8;
  uint64 closed_by_agent_id = 9;
  uint64 pending_transfer_to_agent_id = 10;
  uint64 pending_transfer_from_agent_id = 11;
  string pending_transfer_requested_at = 12;
}

message Message {
  uint64 id = 1;
  uint64 conversation_id = 2;
  string sender_type = 3;
  string sender_id = 4;
  string content = 5;
  string client_msg_id = 6;
  string created_at = 7;
  string updated_at = 8;
  string status = 9;
}

message CreateConversationRequest {
  string site_id = 1;
  string visitor_token = 2;
}

message GetConversationRequest {
  uint64 id = 1;
}

message ListConversationsRequest {
  string status = 1;
  uint64 assigned_agent_id = 2;
  bool unassigned_only = 3;
  string site_id = 4;
  int32 limit = 5;
  int32 offset = 6;
}

message ListConversationsResponse {
  repeated Conversation items = 1;
}

message ClaimConversationRequest {
  uint64 conversation_id = 1;
  uint64 agent_id = 2;
}

message TransferConversationRequest {
  uint64 conversation_id = 1;
  uint64 actor_agent_id = 2;
  string actor_role = 3;
  uint64 to_agent_id = 4;
}

message ConfirmTransferConversationRequest {
  uint64 conversation_id = 1;
  uint64 actor_agent_id = 2;
  string actor_role = 3;
}

message CloseConversationRequest {
  uint64 conversation_id = 1;
  uint64 actor_agent_id = 2;
  string actor_role = 3;
}

message CreateMessageRequest {
  uint64 conversation_id = 1;
  string sender_type = 2;
  string sender_id = 3;
  string content = 4;
  string client_msg_id = 5;
  string visitor_token = 6;
}

message CreateMessageResponse {
  uint64 id = 1;
  uint64 conversation_id = 2;
  string sender_type = 3;
  string sender_id = 4;
  string content = 5;
  string client_msg_id = 6;
  string created_at = 7;
  string updated_at = 8;
  string status = 9;
}

message MarkMessageDeliveredRequest {
  uint64 conversation_id = 1;
  uint64 message_id = 2;
}

message MarkMessageDeliveredResponse {
  bool updated = 1;
  string status = 2;
}

message ListMessagesRequest {
  uint64 conversation_id = 1;
  int32 limit = 2;
  uint64 before_id = 3;
}

message ListMessagesResponse {
  repeated Message items = 1;
}

message MarkMessagesReadRequest {
  uint64 conversation_id = 1;
  uint64 last_read_message_id = 2;
  string actor_type = 3;
  uint64 actor_agent_id = 4;
  string visitor_token = 5;
}

message MarkMessagesReadResponse {
  uint64 updated_count = 1;
}
