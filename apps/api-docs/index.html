<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>InlineChat API 文档</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5/swagger-ui.css" />
    <link rel="stylesheet" href="/app/api-docs/styles.css" />
  </head>
  <body>
    <main class="page">
      <header class="topbar">
        <div>
          <p class="eyebrow">InlineChat Backend</p>
          <h1>Gateway API 文档</h1>
          <p class="sub">
            文档源文件：
            <code>/docs/backend/openapi.yaml</code>
          </p>
        </div>
        <a class="doc-link" href="/docs/backend/README.md" target="_blank" rel="noreferrer">查看后端文档索引</a>
      </header>

      <section class="viewer-wrap">
        <div id="swagger-ui"></div>
        <div id="loadError" class="load-error" hidden>
          <h2>Swagger UI 加载失败</h2>
          <p>
            可能是浏览器无法访问 CDN 资源。你仍可直接查看规范文件：
            <a href="/docs/backend/openapi.yaml" target="_blank" rel="noreferrer">/docs/backend/openapi.yaml</a>
          </p>
        </div>
      </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5/swagger-ui-bundle.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5/swagger-ui-standalone-preset.js"></script>
    <script>
      (function init() {
        if (!window.SwaggerUIBundle) {
          document.getElementById("loadError").hidden = false;
          return;
        }
        window.SwaggerUIBundle({
          url: "/docs/backend/openapi.yaml",
          dom_id: "#swagger-ui",
          deepLinking: true,
          displayRequestDuration: true,
          persistAuthorization: true,
          defaultModelsExpandDepth: 1,
          defaultModelExpandDepth: 2,
          docExpansion: "none",
          presets: [window.SwaggerUIBundle.presets.apis, window.SwaggerUIStandalonePreset],
          layout: "BaseLayout",
        });
      })();
    </script>
  </body>
</html>
