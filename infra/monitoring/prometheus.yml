global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alert_rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  - job_name: gateway-service
    metrics_path: /metrics
    static_configs:
      - targets:
          - gateway-service:8200

  - job_name: chat-service
    metrics_path: /metrics
    static_configs:
      - targets:
          - chat-service:8202

  - job_name: auth-service
    metrics_path: /metrics
    static_configs:
      - targets:
          - auth-service:8201

  - job_name: admin-service
    metrics_path: /metrics
    static_configs:
      - targets:
          - admin-service:8204

  - job_name: realtime-service
    metrics_path: /metrics
    static_configs:
      - targets:
          - realtime-service:8203

  - job_name: readyz-probe
    metrics_path: /probe
    params:
      module:
        - http_2xx
    static_configs:
      - targets:
          - http://gateway-service:8200/readyz
          - http://chat-service:8202/readyz
          - http://auth-service:8201/readyz
          - http://admin-service:8204/readyz
          - http://realtime-service:8203/readyz
    relabel_configs:
      - source_labels:
          - __address__
        target_label: __param_target
      - source_labels:
          - __param_target
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
