<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>InlineChat Widget</title>
    <link rel="stylesheet" href="/app/widget/styles.css" />
  </head>
  <body>
    <main class="chat-shell">
      <header class="chat-header">
        <div>
          <h1 id="titleText">在线客服</h1>
          <p id="statusText">正在连接...</p>
        </div>
        <button id="closeBtn" type="button" aria-label="关闭">×</button>
      </header>

      <section id="messages" class="messages"></section>

      <form id="sendForm" class="send-form">
        <textarea id="contentInput" rows="2" placeholder="请输入消息（回车发送，Shift+回车换行）"></textarea>
        <button id="sendBtn" type="submit">发送</button>
      </form>
    </main>

    <script src="/app/widget/app.js" defer></script>
  </body>
</html>
