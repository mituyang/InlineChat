version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      time: "09:00"
      timezone: Asia/Shanghai
    labels:
      - dependencies
      - github-actions
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(deps)"
      include: scope

  - package-ecosystem: gomod
