name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    name: 后端质量门禁
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'

      - name: 运行格式与静态检查
        run: make lint

      - name: 运行单元测试
        run: make test

      - name: 运行竞态测试
        run: make test-race

      - name: 校验覆盖率门禁
        run: make test-cover

  integration:
    name: 系统集成测试
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 45
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'

      - name: 准备环境变量
        run: cp .env.example .env

      - name: 启动服务
        run: make up

      - name: 执行集成测试
        run: make integration

      - name: 打印容器状态
        if: always()
        run: make ps

      - name: 停止服务
        if: always()
        run: make down
